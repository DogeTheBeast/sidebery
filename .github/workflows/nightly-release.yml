name: build-xpi

on:
  workflow_dispatch:
  push:
    branches:
      - v5

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v6
        with:
          ref: 'v5'
          fetch-depth: 0
      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Build and sign
        run: |
          npm install
          npm run build
          npm run build.ext
      - name: Commit and push XPI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p releases
          cp dist/sidebery-5.6.1.zip releases/sidebery.xpi

          git add releases/sidebery.xpi

          if ! git diff --cached --quiet; then
            git commit -m "chore: update XPI build"
            git push origin HEAD:custom-release-ci
          fi
